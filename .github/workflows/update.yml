name: Refresh NADAC vs Cost Plus Drugs data

on:
  schedule:
    # Runs every Thursday at 13:00 UTC (NADAC files are typically published Wednesdays;
    # this gives CMS a day's buffer before we pull). Adjust as you like:
    # https://crontab.guru is helpful for editing this expression.
    - cron: "0 13 * * 4"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab anytime

permissions:
  contents: write
  pages: write
  id-token: write

# Prevents overlapping runs (e.g. a manual trigger firing at the same time as the
# schedule) from racing each other and causing a rejected push. Only one run of
# this workflow executes at a time; any run started while one is in progress
# waits its turn instead of colliding with it.
concurrency:
  group: "nadac-cpd-pipeline"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Run pipeline
        run: python3 pipeline.py

      - name: Commit refreshed data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/nadac_vs_costplus.xlsx docs/index.html
          git diff --staged --quiet || git commit -m "Auto-refresh NADAC/Cost Plus data $(date -u +%Y-%m-%d)"
          # Pull any commits that landed on the remote after this job's checkout
          # (e.g. from an overlapping run) and rebase our commit on top, so the
          # push below can never be rejected as a non-fast-forward update.
          git pull --rebase origin main
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
